# Fontes oficiais. URLs copiadas do catálogo CKAN do TSE em 2026-10-26 (ver docs/source_inventory.md).
# Campos marcados `status_layout: a_confirmar` vêm do layout de 2022 e PRECISAM ser confirmados
# contra o leiame/dicionário de 2026 extraído do próprio ZIP. A validação de esquema bloqueia o
# pipeline se algum campo obrigatório não existir no cabeçalho real.

catalogo:
  api: https://dadosabertos.tse.jus.br/api/3/action/package_show
  datasets:
    resultados: resultados-{ano}
    eleitorado: eleitorado-{ano}
    candidatos: candidatos-{ano}      # A-05: consulta_cand (situação jurídica, identidade da candidatura)
    comparecimento: comparecimento-e-abstencao-{ano}   # nome observado no grupo em 27/10/2026
  # Grupos do CKAN: os conjuntos do ano são descobertos por package_search (nada é presumido)
  grupos:
    comparecimento_grupo: comparecimento-e-abstencao   # A-05: perfil de quem compareceu/absteve

recursos:
  votacao_secao:
    conjunto: resultados
    descricao: Votação por seção eleitoral. Arquivos por UF trazem só cargos estaduais;
      o arquivo "BR" (abrangência federal) traz Presidente para todas as UFs (leiame 2026).
    url_modelo: https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_{ano}_{uf}.zip
    particionado_por_uf: true
    ufs_publicadas: [BR, AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    membro_csv_sufixo: BR
    arquivo_presidente: BR        # confirmado em 2026-10-26: MG.zip contém cargos 3, 5, 6, 7
    periodicidade_oficial: "Arquivo atualizado ao final de cada turno."
    granularidade: eleição × turno × cargo × seção × votável
    status_layout: confirmado     # cabeçalho real de votacao_secao_2026_MG.csv (sha256 56826e14…)
    colunas_obrigatorias:
      ano: ANO_ELEICAO
      turno: NR_TURNO
      uf: SG_UF
      cd_municipio_tse: CD_MUNICIPIO
      nm_municipio: NM_MUNICIPIO
      zona: NR_ZONA
      secao: NR_SECAO
      cd_cargo: CD_CARGO
      ds_cargo: DS_CARGO
      nr_votavel: NR_VOTAVEL
      nm_votavel: NM_VOTAVEL
      qt_votos: QT_VOTOS
    colunas_opcionais:
      dt_geracao: DT_GERACAO
      hh_geracao: HH_GERACAO
      sq_candidato: SQ_CANDIDATO
      nr_local_votacao: NR_LOCAL_VOTACAO
    votaveis_especiais:            # confirmado em 27/10/2026 (A-06): "VOTO BRANCO"/"VOTO NULO",
      branco: "95"                 # iguais a brancos/nulos do detalhe em todas as seções, 2 turnos
      nulo: "96"
    # Candidaturas inaptas no dia da eleição cujos votos a totalização posterior classifica como
    # nulos técnicos (leiame detalhe_votacao_munzona 2026, QT_VOTOS_NULOS_TECNICOS). ano → turno →
    # NR_VOTAVEL. Evidência e regra em docs/decisions/0005-nulos-tecnicos.md.
    nulos_tecnicos:
      2026:
        1: ["28"]

  detalhe_votacao_secao:
    conjunto: resultados
    descricao: Detalhe da apuração por seção eleitoral. ZIP único com CSVs _<UF> (cargos estaduais),
      _BR (abrangência federal = Presidente), _BRASIL e _ZZ (leiame 2026).
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/detalhe_votacao_secao/detalhe_votacao_secao_{ano}.zip
    particionado_por_uf: false
    membro_csv_sufixo: BR         # Presidente
    granularidade: eleição × turno × cargo × seção
    status_layout: confirmado     # leiame 2026 + cabeçalho real (sha256 11a62c3a…)
    colunas_obrigatorias:
      ano: ANO_ELEICAO
      turno: NR_TURNO
      uf: SG_UF
      cd_municipio_tse: CD_MUNICIPIO
      nm_municipio: NM_MUNICIPIO
      zona: NR_ZONA
      secao: NR_SECAO
      cd_cargo: CD_CARGO
      ds_cargo: DS_CARGO
      qt_aptos: QT_APTOS
      qt_comparecimento: QT_COMPARECIMENTO
      qt_abstencoes: QT_ABSTENCOES
      qt_votos_nominais: QT_VOTOS_NOMINAIS
      qt_votos_brancos: QT_VOTOS_BRANCOS
      qt_votos_nulos: QT_VOTOS_NULOS
    colunas_opcionais:
      dt_geracao: DT_GERACAO
      hh_geracao: HH_GERACAO
      qt_votos_legenda: QT_VOTOS_LEGENDA
      # Leiame: votos de urna sub judice, "ainda não são votos válidos nem nulos". Nunca somar aos nulos.
      qt_votos_anulados_apu_sep: QT_VOTOS_ANULADOS_APU_SEP
      ds_origem_voto: DS_ORIGEM_VOTO
      st_secao_instalada: ST_SECAO_INSTALADA
      st_secao_anulada: ST_SECAO_ANULADA

  detalhe_votacao_munzona:
    conjunto: resultados
    descricao: Detalhe da apuração por município e zona (reconciliação seção → zona)
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/detalhe_votacao_munzona/detalhe_votacao_munzona_{ano}.zip
    particionado_por_uf: false
    membro_csv_sufixo: BR
    complementar: true            # falha/ausência não bloqueia o MVP; vira pendência
    granularidade: eleição × turno × cargo × município × zona (× voto em trânsito)
    status_layout: confirmado_2022  # cabeçalho real 2022; 2026 validado a cada coleta
    colunas_obrigatorias:
      ano: ANO_ELEICAO
      turno: NR_TURNO
      uf: SG_UF
      cd_municipio_tse: CD_MUNICIPIO
      nm_municipio: NM_MUNICIPIO
      zona: NR_ZONA
      cd_cargo: CD_CARGO
      ds_cargo: DS_CARGO
      qt_aptos: QT_APTOS
      qt_comparecimento: QT_COMPARECIMENTO
      qt_abstencoes: QT_ABSTENCOES
      qt_votos_brancos: QT_VOTOS_BRANCOS
      qt_votos_nulos: QT_VOTOS_NULOS
      qt_votos_nominais_validos: QT_VOTOS_NOMINAIS_VALIDOS
    colunas_opcionais:
      dt_geracao: DT_GERACAO
      hh_geracao: HH_GERACAO
      st_voto_em_transito: ST_VOTO_EM_TRANSITO
      qt_total_secoes: QT_TOTAL_SECOES
      qt_secoes_nao_instaladas: QT_SECOES_NAO_INSTALADAS
      qt_eleitores_secoes_nao_instaladas: QT_ELEITORES_SECOES_NAO_INSTALADAS
      qt_total_votos_nulos: QT_TOTAL_VOTOS_NULOS
      qt_votos_nulos_tecnicos: QT_VOTOS_NULOS_TECNICOS
      qt_total_votos_anulados: QT_TOTAL_VOTOS_ANULADOS
      qt_total_votos_anul_subjud: QT_TOTAL_VOTOS_ANUL_SUBJUD
      qt_votos_anulados_apu_sep: QT_VOTOS_ANULADOS_APU_SEP

  votacao_candidato_munzona:
    conjunto: resultados
    descricao: Votação nominal por município e zona — inclui situação jurídica da candidatura
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_{ano}.zip
    particionado_por_uf: false
    membro_csv_sufixo: BR
    complementar: true
    granularidade: eleição × turno × cargo × município × zona × candidatura (× voto em trânsito)
    status_layout: confirmado_2022
    colunas_obrigatorias:
      ano: ANO_ELEICAO
      turno: NR_TURNO
      uf: SG_UF
      cd_municipio_tse: CD_MUNICIPIO
      nm_municipio: NM_MUNICIPIO
      zona: NR_ZONA
      cd_cargo: CD_CARGO
      ds_cargo: DS_CARGO
      sq_candidato: SQ_CANDIDATO
      nr_candidato: NR_CANDIDATO
      nm_urna_candidato: NM_URNA_CANDIDATO
      qt_votos_nominais: QT_VOTOS_NOMINAIS
      qt_votos_nominais_validos: QT_VOTOS_NOMINAIS_VALIDOS
    colunas_opcionais:
      dt_geracao: DT_GERACAO
      hh_geracao: HH_GERACAO
      st_voto_em_transito: ST_VOTO_EM_TRANSITO
      sg_partido: SG_PARTIDO
      ds_situacao_candidatura: DS_SITUACAO_CANDIDATURA
      ds_detalhe_situacao_cand: DS_DETALHE_SITUACAO_CAND
      ds_situacao_julgamento: DS_SITUACAO_JULGAMENTO
      nm_tipo_destinacao_votos: NM_TIPO_DESTINACAO_VOTOS
      ds_sit_tot_turno: DS_SIT_TOT_TURNO

  consulta_cand:
    conjunto: candidatos
    descricao: Candidaturas (situação jurídica, totalização, identidade SQ_CANDIDATO). URL do
      catálogo CKAN candidatos-2026 (inventário de 27/10/2026, A-05). Por ora só cabeçalho,
      leiame e lista de membros; mapeamento de colunas após leitura do dicionário de 2026.
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_{ano}.zip
    particionado_por_uf: false
    somente_perfil: true
    granularidade: eleição × turno × candidatura
    status_layout: a_confirmar

  perfil_comparecimento_abstencao:
    conjunto: comparecimento
    descricao: Perfil de comparecimento e abstenção (descreve participação, não voto). Conjunto
      descoberto no grupo CKAN comparecimento-e-abstencao (inventário de 27/10/2026, A-05).
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_comparecimento_abstencao/perfil_comparecimento_abstencao_{ano}.zip
    particionado_por_uf: false
    somente_perfil: true
    granularidade: a_confirmar (leiame 2026)
    status_layout: a_confirmar
    fase: v2

  perfil_eleitor_secao:
    conjunto: eleitorado
    descricao: Perfil do eleitorado por seção eleitoral (cadastro; não descreve voto)
    url_modelo: https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitor_secao/perfil_eleitor_secao_{ano}_{uf}.zip
    particionado_por_uf: true
    ufs_publicadas: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO, ZZ]
    granularidade: fotografia cadastral × seção × combinação de categorias
    status_layout: a_confirmar
    fase: v2

  perfil_eleitorado:
    conjunto: eleitorado
    descricao: Perfil do eleitorado (todas as UFs)
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitorado/perfil_eleitorado_{ano}.zip
    particionado_por_uf: false
    status_layout: a_confirmar
    fase: v2

  relatorio_totalizacao:
    conjunto: resultados
    descricao: Relatório de Totalização (PDF) — referência para reconciliação manual
    url_modelo: https://cdn.tse.jus.br/estatistica/sead/odsele/relatorio_resultado_totalizacao/Relatorio_Resultado_Totalizacao_{ano}_{uf}.zip
    particionado_por_uf: true
    ufs_publicadas: [BR, MG, ZZ]
    formato: pdf
