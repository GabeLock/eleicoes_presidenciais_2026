name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar uv
        run: pip install uv
      - name: Ambiente fixado (uv.lock)
        run: uv sync --all-extras --locked
      - name: Lint e formatação
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes unitários e de integração (fixtures sintéticas, sem rede)
        run: uv run pytest -ra
