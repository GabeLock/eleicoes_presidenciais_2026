name: Pipeline

# Execução com dados reais do TSE. Manual (não roda a cada commit).
# Artefatos do Actions são temporários: o registro durável são os manifestos,
# que voltam ao repositório por pull request (ver docs/decisions/0002).
on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "Etapa"
        type: choice
        options: [inventory, ingest, pilot, national]
        default: inventory
      uf:
        description: "UF (MG | MG,SP | ALL)"
        default: MG
      year:
        description: "Ano"
        default: "2026"

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar uv
        run: pip install uv
      - name: Ambiente fixado
        run: uv sync --locked
      - name: Executar etapa
        env:
          ETAPA: ${{ inputs.etapa }}
          UF: ${{ inputs.uf }}
          YEAR: ${{ inputs.year }}
        run: |
          case "$ETAPA" in
            inventory) make inventory ;;
            ingest)    make inventory && make ingest YEAR="$YEAR" UF="$UF" && make validate ;;
            pilot)     make inventory && make pilot UF="$UF" ;;
            national)  make inventory && make national ;;
          esac
      - name: Espaço em disco usado
        if: always()
        run: du -sh data/* 2>/dev/null || true
      - name: Publicar manifestos e relatórios (artefato temporário)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ inputs.etapa }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/manifests/
            reports/

  # Devolve manifestos e relatórios ao repositório num branch `resultados/<run_id>`
  # (registro durável; dados brutos nunca são enviados). Único job com escrita.
  publicar:
    needs: run
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-${{ inputs.etapa }}-${{ github.run_id }}
          path: _artefato
      - name: Commit em branch de resultados
        env:
          RUN_ID: ${{ github.run_id }}
          ETAPA: ${{ inputs.etapa }}
          UF: ${{ inputs.uf }}
          RESULT: ${{ needs.run.result }}
        run: |
          set -euo pipefail
          git checkout -b "resultados/${RUN_ID}"
          mkdir -p data/manifests reports
          cp -r _artefato/data/manifests/. data/manifests/ 2>/dev/null || true
          for d in inventory quality dicionarios runs analysis; do
            [ -d "_artefato/reports/$d" ] && mkdir -p "reports/$d" && cp -r "_artefato/reports/$d/." "reports/$d/"
          done
          rm -rf _artefato
          git add -f data/manifests reports
          if git diff --cached --quiet; then echo "Nada a publicar"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Resultados do pipeline: etapa=${ETAPA} uf=${UF} run=${RUN_ID} (${RESULT})"
          git push origin "resultados/${RUN_ID}"
