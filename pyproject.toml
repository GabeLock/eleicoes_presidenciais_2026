[project]
name = "eleicoes"
version = "0.1.0"
description = "Pipeline reprodutível para comparar o 1º e o 2º turnos da eleição presidencial brasileira de 2026 a partir dos dados abertos do TSE."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gabriel (GabeLock)" }]
dependencies = [
    "duckdb>=2.0",
    "polars>=2.1",
    "pyarrow>=26.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "typer>=0.27",
    "rich>=15.0",
    "pypdf>=5",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.66", "plotly>=7.1"]
modeling = ["scikit-learn>=1.9", "statsmodels>=0.15", "pandas>=3.1"]

[project.scripts]
eleicoes = "eleicoes.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eleicoes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "E501"]  # assert em testes; SQL montado só com identificadores de config validados

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: testes de integração com fixtures pequenas (sem rede)"]
